name: Build showcase cards

on:
  push:
    paths-ignore:
      - "assets/showcase/**"
      - "assets/zenkai-card.svg"
      - "assets/cineverse-card.svg"
      - ".github/workflows/build-showcase.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download real app screenshots
        run: |
          mkdir -p assets/showcase
          curl -L --fail --retry 3 -o assets/showcase/zenkai.jpg "https://img2link.com/images/2026/09/28/bb593afe889488619ab18199eb079c79.jpg"
          curl -L --fail --retry 3 -o assets/showcase/cineverse.jpg "https://img2link.com/images/2026/09/28/b1e0cca654cae119b6a828f0c85c0f49.jpg"

      - name: Build cards with embedded screenshots
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path

          def card(image_path, output, title, eyebrow, subtitle, accent, features, footer):
              data = base64.b64encode(Path(image_path).read_bytes()).decode()
              feature_lines = []
              y = 350
              for item in features:
                  feature_lines.append(f'<text x="490" y="{y}" fill="#F4F6FB" font-family="Arial,sans-serif" font-size="18">{item}</text>')
                  y += 34
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="{accent[0]}"/><stop offset="1" stop-color="{accent[1]}"/></linearGradient>
            <clipPath id="screen"><rect x="78" y="158" width="330" height="470" rx="28"/></clipPath>
          </defs>
          <rect width="1200" height="700" rx="26" fill="#0B0D12"/>
          <rect x="22" y="22" width="1156" height="656" rx="22" fill="url(#bg)" stroke="#30384A" stroke-width="2"/>
          <text x="64" y="78" fill="#8D99AE" font-family="monospace" font-size="13" letter-spacing="3">{eyebrow}</text>
          <text x="64" y="128" fill="#F8F9FC" font-family="Arial,sans-serif" font-size="48" font-weight="700">{title}</text>
          <text x="64" y="155" fill="#AEB8C9" font-family="Arial,sans-serif" font-size="16">{subtitle}</text>

          <rect x="68" y="148" width="350" height="500" rx="34" fill="#070A10" stroke="#4A556C" stroke-width="2"/>
          <image href="data:image/jpeg;base64,{data}" x="78" y="158" width="330" height="470" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen)"/>
          <rect x="78" y="158" width="330" height="470" rx="28" fill="none" stroke="#202A3A" stroke-width="2"/>
          <rect x="205" y="164" width="76" height="6" rx="3" fill="#111722" opacity=".9"/>

          <rect x="462" y="184" width="648" height="444" rx="20" fill="#0D111A" stroke="#2D374A"/>
          <text x="490" y="235" fill="#7F8BA1" font-family="monospace" font-size="12" letter-spacing="2">{"ZENKAI / FEATURES" if title == "ZENKAI" else "CINEVERSE / PLATFORM"}</text>
          <line x1="490" y1="270" x2="1080" y2="270" stroke="#334056"/>
          <text x="490" y="318" fill="#F0F3FA" font-family="Arial,sans-serif" font-size="15" font-weight="700">{"FEATURES" if title == "ZENKAI" else "PLATFORM"}</text>
          {''.join(feature_lines)}
          <line x1="490" y1="570" x2="1080" y2="570" stroke="#334056"/>
          <text x="490" y="604" fill="#7F8BA1" font-family="monospace" font-size="12">{footer}</text>
          </svg>'''
              Path(output).write_text(svg)

          card(
            "assets/showcase/zenkai.jpg", "assets/zenkai-card.svg",
            "ZENKAI", "01 / ANDROID MEDIA PLATFORM", "Watch. Read. Save. Connect.",
            ("#101B30", "#182A43"),
            ["MULTI-SERVER PLAYBACK", "PICTURE-IN-PICTURE", "DOWNLOAD MANAGER", "MANGA + NOVEL READING", "DISCORD RICH PRESENCE", "COMMUNITY + LIBRARY"],
            "KOTLIN · ANDROID · MEDIA · APIs"
          )

          card(
            "assets/showcase/cineverse.jpg", "assets/cineverse-card.svg",
            "CINEVERSE", "02 / CINEMATIC STREAMING PLATFORM", "Discover movies and TV without the clutter.",
            ("#17111F", "#241A31"),
            ["MOVIE + TV DISCOVERY", "TMDB METADATA", "MULTI-PROVIDER RESOLUTION", "STREAM EXTRACTION", "FASTAPI + PLAYWRIGHT", "REACT + TYPESCRIPT"],
            "CINEVERSE-DET.PAGES.DEV · MOVIES · TV"
          )
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/build-showcase.yml

      - name: Commit showcase assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showcase assets/zenkai-card.svg assets/cineverse-card.svg .github/workflows/build-showcase.yml
          git commit -m "docs: embed real app screenshots in showcase cards" || exit 0
          git push
